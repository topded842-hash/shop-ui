<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP UI | Твой магазин</title>
    <style>
        :root {
            --color-1: #ff00de; 
            --color-2: #00e5ff; 
            --bg-dark: #080808; 
            --card-bg: rgba(20, 20, 20, 0.8); 
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .background-name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            font-size: 15vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 15px;
            text-align: center;
            line-height: 1;
            user-select: none;
            background: linear-gradient(45deg, var(--color-1), var(--color-2), var(--color-1));
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 8s ease infinite;
            filter: drop-shadow(0 0 20px rgba(255, 0, 222, 0.3));
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        header {
            width: 100%;
            padding: 40px 0;
            text-align: center;
            backdrop-filter: blur(5px);
            background: rgba(8, 8, 8, 0.5);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
        }
        header p {
            font-size: 1rem;
            color: #aaa;
            margin-top: 5px;
        }
        .container {
            max-width: 1200px;
            width: 90%;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            z-index: 5;
        }
        /* Стиль для сообщения о пустом складе */
        .sold-out-msg {
            grid-column: 1 / -1;
            text-align: center;
            background: var(--card-bg);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .sold-out-msg h2 {
            font-size: 2rem;
            background: linear-gradient(45deg, var(--color-1), var(--color-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        .sold-out-msg p {
            font-size: 1.2rem;
            color: #ccc;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 229, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0, 229, 255, 0.15);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        .card h3 {
            margin: 10px 0 5px;
            font-size: 1.3rem;
        }
        .flavor-tag {
            font-size: 0.95rem;
            color: #bbb;
            margin-bottom: 15px;
            display: block;
        }
        .price {
            font-size: 1.7rem;
            color: #fff;
            font-weight: 800;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255, 0, 222, 0.5);
        }
        .buy-btn {
            display: block;
            padding: 15px;
            background: linear-gradient(45deg, var(--color-1), var(--color-2));
            color: #fff;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s ease;
        }
        .buy-btn:hover {
            box-shadow: 0 5px 25px rgba(255, 0, 222, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="background-name">SHOP<br>UI</div>
    <header>
        <h1>SHOP UI</h1>
        <p>Premium Liquids & Devices</p>
    </header>
    <div class="container" id="catalog"></div>

    <script>
        // Когда всё раскупили — просто оставь массив пустым: []
        // Как только будет завоз — добавь объекты с товарами обратно.
        const products = [];

        const catalog = document.getElementById('catalog');

        if (products.length === 0) {
            // Если товаров нет — выводим это сообщение
            catalog.innerHTML = `
                <div class="sold-out-msg">
                    <h2>ВСЕ ТОВАРЫ РАСПРОДАНЫ!</h2>
                    <p>Следите за новостями в канале и ждите нового завоза.</p>
                    <br>
                    <a href="https://t.me/Shop_UI" class="buy-btn" style="display: inline-block; padding: 15px 40px;">ПЕРЕЙТИ В КАНАЛ</a>
                </div>
            `;
        } else {
            // Если товары есть — отрисовываем их
            products.forEach(item => {
                catalog.innerHTML += `
                    <div class="card">
                        <div class="card-top">
                            <img src="${item.img}" alt="${item.name}">
                            <h3>${item.name}</h3>
                            <span class="flavor-tag">${item.flavor}</span>
                        </div>
                        <div class="card-bottom">
                            <div class="price">${item.price} ₽</div>
                            <a href="https://t.me/Shop_UI" class="buy-btn">КУПИТЬ</a>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
