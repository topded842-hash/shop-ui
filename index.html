# Полностью улучшенный SHOP UI

```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP UI</title>

    <style>
        :root {
            --color-1: #ff00de;
            --color-2: #00e5ff;
            --bg-dark: #050505;
            --card-bg: rgba(18, 18, 18, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            background:
                radial-gradient(circle at top left, rgba(255,0,222,0.08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(0,229,255,0.08), transparent 30%),
                var(--bg-dark);

            color: #fff;

            font-family: 'Segoe UI', Roboto, sans-serif;

            overflow-x: hidden;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .background-name {
            position: fixed;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: -1;

            font-size: 18vw;
            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 20px;

            text-align: center;

            line-height: 0.8;

            user-select: none;

            background: linear-gradient(
                90deg,
                #00e5ff,
                #ff00de,
                #00e5ff
            );

            background-size: 300% 300%;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation: gradientShift 10s ease infinite;

            opacity: 0.08;

            filter: blur(1px);
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        header {
            width: 100%;

            padding: 35px 0;

            text-align: center;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            background: rgba(5, 5, 5, 0.75);

            position: sticky;
            top: 0;
            z-index: 100;

            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        header h1 {
            margin: 0;

            font-size: 3rem;

            letter-spacing: 10px;

            font-weight: 900;

            text-transform: uppercase;

            background: linear-gradient(to right, #ffffff, #bbbbbb);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 95%;
            max-width: 1400px;

            margin: 40px auto;

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));

            gap: 25px;
        }

        .card {
            position: relative;

            background: var(--card-bg);

            border: 1px solid rgba(255,255,255,0.06);

            border-radius: 28px;

            padding: 18px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            overflow: hidden;

            text-align: center;

            transition: 0.35s ease;

            display: flex;
            flex-direction: column;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.06),
                transparent
            );

            transition: 0.7s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);

            border-color: rgba(0,229,255,0.4);

            box-shadow:
                0 0 25px rgba(0,229,255,0.15),
                0 0 50px rgba(255,0,222,0.08);
        }

        .card img {
            width: 100%;
            height: 260px;

            object-fit: cover;

            border-radius: 20px;

            margin-bottom: 18px;

            background: #0d0d0d;

            transition: 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.03);
        }

        .category-tag {
            position: absolute;

            top: 15px;
            right: 15px;

            padding: 6px 12px;

            border-radius: 12px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.08);

            color: var(--color-2);

            font-size: 0.7rem;

            font-weight: 700;

            text-transform: uppercase;

            backdrop-filter: blur(10px);
        }

        .card h3 {
            margin: 10px 0 8px;

            font-size: 1.15rem;

            min-height: 48px;
        }

        .flavor-tag {
            display: block;

            min-height: 45px;

            margin-bottom: 18px;

            color: #9d9d9d;

            font-size: 0.92rem;

            line-height: 1.4;
        }

        .price {
            font-size: 2rem;

            font-weight: 900;

            margin-bottom: 20px;
        }

        .buy-btn {
            margin-top: auto;

            display: block;

            padding: 16px;

            border-radius: 18px;

            text-decoration: none;

            font-weight: 900;

            letter-spacing: 1px;

            text-transform: uppercase;

            background: linear-gradient(90deg, #00e5ff, #ff00de);

            color: white;

            transition: 0.3s ease;
        }

        .buy-btn:hover {
            transform: scale(1.03);

            box-shadow:
                0 0 20px rgba(0,229,255,0.4),
                0 0 40px rgba(255,0,222,0.2);
        }

        footer {
            padding: 40px;

            color: #444;

            font-size: 0.8rem;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .background-name {
                font-size: 28vw;
            }

            header h1 {
                font-size: 2rem;
            }

            .card img {
                height: 220px;
            }
        }
    </style>
</head>

## Важно

Твои PNG должны лежать рядом с HTML-файлом:

* 1.png
* 2.png
* 3.png
* и т.д.

Лучше использовать:

* PNG/WebP
* 800x800 или больше
* прозрачный фон
* одинаковый размер у всех товаров
