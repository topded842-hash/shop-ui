<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP UI | Твой магазин</title>
    <style>
        :root {
            /* Цвета для переливающегося градиента (как на аватарке) */
            --color-1: #ff00de; /* Яркий розовый */
            --color-2: #00e5ff; /* Яркий голубой */
            --bg-dark: #080808; /* Глубокий черный фон */
            --card-bg: rgba(20, 20, 20, 0.8); /* Полупрозрачный фон карточек */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ЗАДНИЙ ФОН С НАДПИСЬЮ --- */
        .background-name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1; /* Уходим на задний план */
            font-size: 15vw; /* Очень большой размер от ширины экрана */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 15px;
            text-align: center;
            line-height: 1;
            user-select: none; /* Нельзя выделить текст */
            
            /* Эффект переливающегося градиента */
            background: linear-gradient(
                45deg, 
                var(--color-1), 
                var(--color-2), 
                var(--color-1)
            );
            background-size: 400% 400%;
            -webkit-background-clip: text; /* Применяем градиент к тексту */
            background-clip: text;
            -webkit-text-fill-color: transparent; /* Делаем сам текст прозрачным */
            
            /* Анимация перелива */
            animation: gradientShift 8s ease infinite;
            
            /* Легкое свечение */
            filter: drop-shadow(0 0 20px rgba(255, 0, 222, 0.3));
        }

        /* Анимация движения градиента */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- ШАПКА САЙТА (МИНУМАЛИЗМ) --- */
        header {
            width: 100%;
            padding: 40px 0;
            text-align: center;
            backdrop-filter: blur(5px); /* Легкое размытие при скролле */
            background: rgba(8, 8, 8, 0.5);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
        }

        header p {
            font-size: 1rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* --- СЕТКА ТОВАРОВ --- */
        .container {
            max-width: 1200px;
            width: 90%;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            z-index: 5; /* Карточки поверх фона */
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px); /* Эффект матового стекла */
            transition: all 0.4s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 229, 255, 0.3); /* Голубое свечение при наведении */
            box-shadow: 0 15px 40px rgba(0, 229, 255, 0.15);
}

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .card h3 {
            margin: 10px 0 5px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .flavor-tag {
            font-size: 0.95rem;
            color: #bbb;
            margin-bottom: 15px;
            display: block;
        }

        .price {
            font-size: 1.7rem;
            color: #fff;
            font-weight: 800;
            margin: 15px 0;
            /* Небольшое розовое свечение цены */
            text-shadow: 0 0 10px rgba(255, 0, 222, 0.5);
        }

        .buy-btn {
            display: block;
            padding: 15px;
            background: linear-gradient(45deg, var(--color-1), var(--color-2));
            color: #fff;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .buy-btn:hover {
            box-shadow: 0 5px 25px rgba(255, 0, 222, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="background-name">SHOP<br>UI</div>

    <header>
        <h1>SHOP UI</h1>
        <p>Premium Liquids & Devices</p>
    </header>

    <div class="container" id="catalog">
        </div>

    <script>
        /* ТУТ ТЫ РЕДАКТИРУЕШЬ ТОВАРЫ (как в прошлый раз) */
        const products = [
            { name: "Podonki АНАРХИЯ V2", price: 450, img: "salt.png", flavor: "Лесной виноград" },
            { name: "Podonki АНАРХИЯ V2", price: 450, img: "salt.png", flavor: "Ананасовый джем + манго" },
            { name: "RAZ|EB", price: 450, img: "rr.png", flavor: "Спрайт" }
        ];

        const catalog = document.getElementById('catalog');

        products.forEach(item => {
            // Отрисовываем карточки товаров
            catalog.innerHTML += `
                <div class="card">
                    <div class="card-top">
                        <img src="${item.img}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <span class="flavor-tag">${item.flavor}</span>
                    </div>
                    <div class="card-bottom">
                        <div class="price">${item.price} ₽</div>
                        <a href="https://t.me/Shop_UI" class="buy-btn">КУПИТЬ</a>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
